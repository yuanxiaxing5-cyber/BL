<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a0f12" />
<link rel="stylesheet" type="text/css" href="https://mui.kernelsu.org/internal/insets.css">
<title>安卓设备隐藏bl模块</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --safe-top: var(--window-inset-top, env(safe-area-inset-top, 0px));
    --safe-bottom: var(--window-inset-bottom, env(safe-area-inset-bottom, 0px));
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background-color: #000;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    color: #ffffff;
    position: relative;
    background: url('bj.png') no-repeat center center fixed;
    background-size: cover;
}

.wrapper{
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    /* 使用 clamp 动态适应不同分辨率的内边距 */
    padding-top: calc(clamp(12px, 3vh, 20px) + var(--safe-top));
    padding-left: calc(clamp(12px, 4vw, 20px) + var(--window-inset-left, env(safe-area-inset-left, 0px)));
    padding-right: calc(clamp(12px, 4vw, 20px) + var(--window-inset-right, env(safe-area-inset-right, 0px)));
    padding-bottom: calc(clamp(80px, 12vh, 100px) + var(--safe-bottom));
}

.hero{
    position:relative;
    overflow:hidden;
    padding: clamp(20px, 5.5vw, 26px) clamp(18px, 5vw, 22px);
    border-radius: clamp(20px, 6vw, 28px);
    background: rgba(0, 0, 0, 0.22);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.card{
    position:relative;
    overflow:hidden;
    background: rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: clamp(20px, 6vw, 28px);
    padding: clamp(18px, 5vw, 22px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
}

.hero::before,
.card::before {
    content: '';
    position: absolute;
    width: clamp(90px, 25vw, 120px);
    height: clamp(90px, 25vw, 120px);
    background: linear-gradient(135deg, #f48fb1, #ad1457);
    filter: blur(40px);
    opacity: 0.2;
    border-radius: 50%;
    top: -30px;
    right: -30px;
    pointer-events: none;
    z-index: 0;
}

.hero::after,
.card::after {
    content: '';
    position: absolute;
    width: clamp(80px, 22vw, 110px);
    height: clamp(80px, 22vw, 110px);
    background: linear-gradient(135deg, #880e4f, #f48fb1);
    filter: blur(40px);
    opacity: 0.18;
    border-radius: 50%;
    bottom: -30px;
    left: -30px;
    pointer-events: none;
    z-index: 0;
}

.logo{
    position: relative;
    z-index: 1;
    width: clamp(50px, 14vw, 60px);
    height: clamp(50px, 14vw, 60px);
    border-radius: clamp(16px, 4.5vw, 20px);
    background:linear-gradient(135deg, #f48fb1, #880e4f);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: clamp(24px, 7vw, 30px);
    margin-bottom: clamp(12px, 3.5vw, 16px);
    box-shadow:0 8px 22px rgba(244, 143, 177, 0.35);
}

.title{
    position: relative;
    z-index: 1;
    font-size: clamp(22px, 6.2vw, 26px);
    font-weight:700;
    letter-spacing:-0.3px;
    color: #ffffff;
    text-shadow: 
        0 0 2px #000,
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
}

.desc{
    position: relative;
    z-index: 1;
    margin-top:6px;
    font-size: clamp(13px, 3.6vw, 14px);
    font-weight: 500;
    color: #f2dae2;
    text-shadow: 
        0 0 2px #000,
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
}

.section{
    margin-top: clamp(14px, 4.5vw, 20px);
}

.card-title{
    position: relative;
    z-index: 1;
    font-size: clamp(18px, 5vw, 20px);
    font-weight:700;
    margin-bottom: clamp(10px, 3vw, 12px);
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ffffff;
    text-shadow: 
        0 0 2px #000,
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
}

.card-sub{
    position: relative;
    z-index: 1;
    font-size: clamp(13px, 3.6vw, 14px);
    line-height:1.6;
    margin-bottom: clamp(12px, 3.5vw, 16px);
    font-weight: 500;
    color: #f2dae2;
    text-shadow: 
        0 0 2px #000,
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
}

.action-btn{
    position: relative;
    z-index: 1;
    width:100%;
    border:none;
    border-radius: clamp(16px, 4.5vw, 20px);
    padding: clamp(13px, 3.8vw, 16px);
    color:#ffffff;
    font-size: clamp(14px, 4vw, 15.5px);
    font-weight:700;
    margin-bottom: 12px;
    background:linear-gradient(135deg, rgba(216, 67, 121, 0.92), rgba(136, 14, 79, 0.92));
    box-shadow:0 8px 22px rgba(216, 67, 121, 0.35);
    transition:all .18s ease;
    cursor: pointer;
    text-shadow: 
        0 0 2px #000,
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
}

.action-btn:active{
    transform:scale(.96);
}

.action-btn.orange {
    background: linear-gradient(135deg, rgba(244, 143, 177, 0.92), rgba(194, 24, 91, 0.92));
    box-shadow: 0 8px 22px rgba(244, 143, 177, 0.35);
}

.action-btn:last-child{
    margin-bottom: 0;
}

.log{
    position: relative;
    z-index: 1;
    margin-top:16px;
    background: rgba(10, 5, 8, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: clamp(14px, 4vw, 18px);
    padding: clamp(12px, 3.5vw, 16px);
    color:#7dffa5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    text-align:left;
    font-size: clamp(12px, 3.2vw, 13px);
    line-height:1.5;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    word-break: break-all;
}

.bottom-nav{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom: calc(clamp(10px, 2.5vh, 16px) + var(--safe-bottom));
    width: calc(100% - clamp(24px, 7vw, 36px));
    max-width:440px;
    padding: clamp(4px, 1.2vw, 6px);
    border-radius: clamp(22px, 6vw, 28px);
    background: rgba(20, 10, 15, 0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border:1px solid rgba(255, 255, 255, 0.3);
    display:flex;
    gap:clamp(4px, 2vw, 8px);
    box-shadow:0 10px 30px rgba(0, 0, 0, 0.3);
    z-index: 100;
}

.nav-btn{
    flex:1;
    border:none;
    background:transparent;
    padding: clamp(10px, 3vw, 13px) clamp(8px, 2vw, 10px);
    border-radius: clamp(18px, 5vw, 22px);
    font-size: clamp(13.5px, 3.8vw, 15px);
    font-weight:700;
    transition:all .2s ease;
    cursor: pointer;
    color: #ffffff;
    text-shadow: 
        0 0 2px #000,
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
}

.nav-btn.active{
    background: rgba(244, 143, 177, 0.38);
    color:#ffffff;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.page{
    display:none;
    animation:fade .25s ease forwards;
}

.page.active{
    display:block;
}

.info-list{
    position: relative;
    z-index: 1;
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap: clamp(8px, 2.8vw, 12px);
}

.info-item{
    padding: clamp(12px, 3.8vw, 16px);
    border-radius: clamp(14px, 4vw, 18px);
    background: rgba(0, 0, 0, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    font-size: clamp(12.5px, 3.5vw, 14px);
    line-height: 1.65;
    font-weight: 500;
    color: #f2dae2;
    text-shadow: 
        0 0 2px #000,
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
}

.info-item b{
    display:block;
    font-size: clamp(13.5px, 3.8vw, 15px);
    margin-bottom:6px;
    color: #ffffff;
    text-shadow: 
        0 0 2px #000,
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
}

.info-divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.3);
    margin: clamp(8px, 2vw, 10px) 0;
}
@media screen and (max-width: 360px) {
    .wrapper {
        padding-left: 10px;
        padding-right: 10px;
    }
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>
<body>

<div class="wrapper">
    <div id="homePage" class="page active">
        <div class="hero">
            <div class="logo">🛡️</div>
            <div class="title">安卓设备隐藏bl模块</div>
        </div>
        <div class="section">
            <div class="card">
                <div class="card-title">模块状态</div>
                <div class="info-list">
                    <div class="info-item">
                        <b>模块说明</b>
                        模块已实现自动更新包名（需要 Zygisk 模块支持）<br>
                        配置隐藏应用只支持 OSS 版本 162 及以下<br>
                        去除更新密钥 – 因为我会同步更新模块内的密钥所以不需要<br>
                        天机开机自己启动 USB 调试的问题也解决了
                        <div class="info-divider"></div>
                        <span style="color:#f2dae2; font-size: clamp(11.5px, 3.2vw, 13px);">
                            ----------------------------------------------<br>
                            自动更新模块需要 zygisk 是因为普通这种类型模块需要无线循环添加包名,使用 zygisk 后就可以做到安装软件才会触发更新这样功耗几乎没有
                        </span>
                    </div>
                    <div class="info-item">
                        <b>模块版本</b>
                        <span style="font-weight:700; color:#ffb7d5;">1.1</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="featurePage" class="page">
        <div class="card">
            <div class="card-title">一键配置</div>
            <div class="card-sub">快捷一键写入应用隐藏列表配置</div>
            <button id="execBtnAll" class="action-btn">🚀 隐藏应用列表配置</button>
            <button id="execBtnAll2" class="action-btn orange">🚀 隐藏应用列表配置 (scene版)</button>
            <div id="log" class="log">等待执行...</div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-btn active" data-page="homePage">🏠 主页</button>
    <button class="nav-btn" data-page="featurePage">⚙️ 功能</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const navBtns = document.querySelectorAll('.nav-btn');
    const pages = document.querySelectorAll('.page');

    navBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const pageId = btn.getAttribute('data-page');
            
            navBtns.forEach(b => b.classList.remove('active'));
            pages.forEach(p => p.classList.remove('active'));

            btn.classList.add('active');
            const targetPage = document.getElementById(pageId);
            if(targetPage) {
                targetPage.classList.add('active');
            }
        });
    });
});
</script>
<script src="main.js"></script>
</body>
</html>
