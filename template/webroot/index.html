
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>安卓设备隐藏bl模块</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}
body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top left, rgba(0,180,255,.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(120,0,255,.25), transparent 35%),
        #0b0f18;
    color:#fff;
    overflow:hidden;
}
.wrapper{
    padding:20px 18px 120px;
}
.hero{
    position:relative;
    overflow:hidden;
    padding:26px;
    border-radius:30px;
    background:rgba(255,255,255,.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 10px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.08);
}
.glow{
    position:absolute;
    width:180px;
    height:180px;
    background:linear-gradient(135deg,#2dd4ff,#7c3aed);
    filter:blur(80px);
    opacity:.35;
    border-radius:50%;
    top:-60px;
    right:-60px;
}
.logo{
    width:60px;
    height:60px;
    border-radius:20px;
    background:linear-gradient(135deg,#4cc9ff,#7c3aed);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(76,201,255,.35);
}
.title{
    font-size:30px;
    font-weight:700;
    letter-spacing:.5px;
}
.desc{
    margin-top:10px;
    color:rgba(255,255,255,.72);
    line-height:1.7;
    font-size:14px;
}
.section{
    margin-top:22px;
}
.card{
    background:rgba(255,255,255,.07);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.22);
}
.card-title{
    font-size:22px;
    font-weight:700;
    margin-bottom:8px;
}
.card-sub{
    color:rgba(255,255,255,.68);
    font-size:14px;
    line-height:1.6;
    margin-bottom:18px;
}
.action-btn{
    width:100%;
    border:none;
    border-radius:22px;
    padding:16px;
    color:#fff;
    font-size:16px;
    font-weight:700;
    margin-bottom: 12px;
    background:linear-gradient(135deg,#19b5ff,#7c3aed);
    box-shadow:0 8px 25px rgba(32,158,255,.35);
    transition:.18s ease;
}
.action-btn.orange {
    background: linear-gradient(135deg, #ff9f43, #ff5252);
    box-shadow: 0 8px 25px rgba(255, 107, 107, 0.35);
}
.action-btn:active{
    transform:scale(.96);
}
.action-btn:last-child{
    margin-bottom: 0;
}
.log{
    margin-top:16px;
    background:rgba(0,0,0,.28);
    border-radius:18px;
    padding:14px;
    color:#7dffa5;
    font-family:monospace;
    text-align:center;
    font-size:13px;
}
.bottom-nav{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:18px;
    width:92%;
    max-width:460px;
    padding:10px;
    border-radius:30px;
    background:rgba(255,255,255,.12);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border:1px solid rgba(255,255,255,.12);
    display:flex;
    gap:10px;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
}
.nav-btn{
    flex:1;
    border:none;
    background:transparent;
    color:rgba(255,255,255,.65);
    padding:14px 10px;
    border-radius:22px;
    font-size:15px;
    font-weight:600;
    transition:.2s ease;
}
.nav-btn.active{
    background:rgba(255,255,255,.18);
    color:#fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}
.page{
    display:none;
    animation:fade .25s ease;
}
.page.active{
    display:block;
}
.info-list{
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:12px;
}
.info-item{
    padding:14px;
    border-radius:18px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.06);
}
.info-item b{
    display:block;
    margin-bottom:4px;
}
@keyframes fade{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>
<body>
<div class="wrapper">
    <div id="homePage" class="page active">
        <div class="hero">
            <div class="glow"></div>
            <div class="logo">🛡️</div>
            <div class="title">安卓设备隐藏bl模块</div>
            <div class="desc"></div>
        </div>
        <div class="section">
            <div class="card">
                <div class="card-title">模块状态</div>
                <div class="info-list">
                    <div class="info-item">
                        <b>模块说明</b>
                        模块以实现自动更新包名(需要zygisk模块)<br>
                        配置隐藏应用只支持oss版本162及一下<br>
                        去除更新密钥–因为我会同步更新模块内的密钥所以不需要<br>
天机开机自己启动USB调试的问题也解决了<br>
                        ----------------------------------------------<br>
                        自动更新模块需要zygisk是因为普通这种类型模块需要无线循环添加包名,使用zygisk后就可以做到安装软件才会触发更新这样功耗几乎没有
                    </div>
                    <div class="info-item">
                        <b>模块版本</b>
                        1.1
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="featurePage" class="page">
        <div class="card">
            <div class="card-title">一键配置</div>
            <div class="card-sub">
            </div>
<button id="execBtnAll" class="action-btn">🚀 隐藏应用列表配置</button>
            <button id="execBtnAll2" class="action-btn">🚀 隐藏应用列表配置(scene版)</button>
            <div id="log" class="log">等待执行...</div>
        </div>
    </div>
</div>
<div class="bottom-nav">
    <button class="nav-btn active" data-page="homePage">🏠 主页</button>
    <button class="nav-btn" data-page="featurePage">⚙️ 功能</button>
</div>
<script src="main.js"></script>
</body>
</html>
